[package]
name = "crucible"
description = "Refresh crucible's pinned toolchains and diagnose the environment that uses them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["net"]
# `update` and `pin`, and everything they download and hash with. Without it
# the binary is `doctor` alone, which skips compiling ring's C and rustls for
# a bare `nix run github:kiyors/crucible`.
net = ["dep:pins"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
doctor.workspace = true
init.workspace = true
pins = { workspace = true, optional = true }

[lints]
workspace = true
