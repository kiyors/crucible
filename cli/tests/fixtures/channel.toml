# A hand-made slice of channel-rust-*.toml, shaped like the real thing: every
# field the trimmer reads, an unavailable target, a pkg it drops, a pkg with a
# "*" target, and a target without xz fields (the fallback path).
manifest-version = "2"
date = "2026-11-12"

[pkg.rustc]
version = "1.100.0 (0ef1bc386 2026-11-09)"

[pkg.rustc.target.x86_64-unknown-linux-gnu]
available = true
url = "https://example.invalid/rustc-1.100.0-x86_64-unknown-linux-gnu.tar.gz"
hash = "1111"
xz_url = "https://example.invalid/rustc-1.100.0-x86_64-unknown-linux-gnu.tar.xz"
xz_hash = "aaaa"

[pkg.rustc.target.aarch64-unknown-linux-gnu]
available = true
url = "https://example.invalid/rustc-1.100.0-aarch64-unknown-linux-gnu.tar.gz"
hash = "2222"
xz_url = "https://example.invalid/rustc-1.100.0-aarch64-unknown-linux-gnu.tar.xz"
xz_hash = "bbbb"

[pkg.rustc.target.aarch64-apple-darwin]
available = true
url = "https://example.invalid/rustc-1.100.0-aarch64-apple-darwin.tar.gz"
hash = "3333"
xz_url = "https://example.invalid/rustc-1.100.0-aarch64-apple-darwin.tar.xz"
xz_hash = "cccc"

[pkg.cargo]
version = "0.101.0 (3acc79c0c 2026-11-05)"

[pkg.cargo.target.aarch64-apple-darwin]
available = true
url = "https://example.invalid/cargo-1.100.0-aarch64-apple-darwin.tar.gz"
hash = "4444"

[pkg.rust-std]
version = "1.100.0 (0ef1bc386 2026-11-09)"

