[package]
name = "crucible"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Refresh crucible's pinned toolchains and diagnose the environment that uses them"
publish = false

[features]
default = ["net"]
# `update` and `pin`, and everything they download and hash with. Without it
# the binary is `doctor` alone, which skips compiling ring's C and rustls for
# a bare `nix run github:kiyors/crucible`.
net = [
  "dep:base64",
  "dep:indexmap",
  "dep:pgp",
  "dep:serde",
  "dep:serde_yaml_ng",
  "dep:sha2",
  "dep:ureq",
]

[dependencies]
anyhow = "1"
base64 = { version = "0.22", optional = true }
clap = { version = "4.5", features = ["derive"] }
# Ordered maps, so a manifest's package order survives into data/rust/*.json.
indexmap = { version = "2", features = ["serde"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
# The channel manifest is big and its package order is part of the output, so
# both parsers must keep insertion order.
# `doctor` reads package.json even in the doctor-only build, so this one is
# not behind `net` (the doctor binary still leaves out ring and rustls).
serde_json = { version = "1", features = ["preserve_order"] }
# Verify nodejs.org's SHASUMS256.txt.sig without a system gpgv. No default
# features: the bzip2 one is the only C dependency.
pgp = { version = "0.21", default-features = false, optional = true }
# Vite+ publishes its dependency tree as a pnpm lockfile, which is YAML.
serde_yaml_ng = { version = "0.10", optional = true }
sha2 = { version = "0.10", optional = true }
toml = { version = "0.8", features = ["preserve_order"] }
# Default features give us rustls, and a synchronous API keeps the binary small.
ureq = { version = "2", optional = true }

[[test]]
name = "trim"
required-features = ["net"]
