name: update

# The scheduled pin refresh: run `crucible update` with the latest released
# CLI when the CLI's source has not changed since that release, and otherwise
# (or before the first release) with `nix run .#crucible-full` built from this
# checkout. An older release writes data/ in the shape it knew, dropping what
# newer code pins (free-threaded Python, say), so it must not run. Then, when
# data/ changed, run the check workflow's builds on x86_64-linux,
# aarch64-linux and macOS on the refreshed data, and commit it straight to
# main. A refresh is data only, so nothing here needs a pull request, a review
# or the "Allow GitHub Actions to create and approve pull requests" setting.
#
# The push uses the default GITHUB_TOKEN, which does not start other
# workflows, so `check` does not re-run on that commit; the `checks` job below
# is the check for it.

on:
  schedule:
    # Hours 0, 10 and 20 UTC: about every 10 hours, as close as cron gets
    # (24 is not a multiple of 10). The pins rarely move faster than that.
    - cron: "17 */10 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  # A new run waits for the current one instead of overlapping it.
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      data_changed: ${{ steps.changed.outputs.data_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release tag, to compare the CLI's source against.
          fetch-depth: 0
          fetch-tags: true

      - name: Download the latest released CLI
        id: download
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/cli"
          mkdir -p "$work"
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)"
          if [ -z "${tag:-}" ] || [ "$tag" = "null" ]; then
            echo "no release found; using nix run .#crucible-full -- update instead"
            echo "mode=nix" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Everything package.nix builds the CLI from. Any change since the
          # tag means the release is not this checkout's updater.
          if ! git diff --quiet "$tag" HEAD -- Cargo.toml Cargo.lock crates data/node/release-keys.asc; then
            echo "the CLI changed since $tag; using nix run .#crucible-full -- update instead"
            echo "mode=nix" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          asset="crucible-${tag#v}-x86_64-unknown-linux-musl.tar.gz"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern "$asset" --pattern SHA256SUMS --dir "$work"
          [ -f "$work/$asset" ] || {
            echo "error: release $tag has no $asset" >&2
            exit 1
          }
          [ -f "$work/SHA256SUMS" ] || {
            echo "error: release $tag has no SHA256SUMS" >&2
            exit 1
          }
          # Verify the tarball against the sums the release publishes.
          expected="$(grep -F "$asset" "$work/SHA256SUMS" | awk '{print $1}' || true)"
          if [ -z "${expected:-}" ]; then
            echo "error: SHA256SUMS has no entry for $asset" >&2
            exit 1
          fi
          actual="$(sha256sum "$work/$asset" | awk '{print $1}')"
          if [ "$expected" != "$actual" ]; then
            echo "error: sha256 mismatch for $asset: expected $expected, got $actual" >&2
            exit 1
          fi
          # And the attestation the release workflow added.
          gh attestation verify "$work/$asset" --repo "$GITHUB_REPOSITORY"
          mkdir "$work/bin"
          tar -xzf "$work/$asset" -C "$work/bin"
          "$work/bin/crucible" update
          echo "mode=released" >> "$GITHUB_OUTPUT"

      # The fallback builds the CLI from this checkout, so it needs Nix; the
      # released path does not. It runs before the first release and whenever
      # the CLI has moved past the latest one.
      - uses: ./.github/actions/setup-nix
        if: steps.download.outputs.mode == 'nix'

      - name: Update the pins with the repo's own CLI
        if: steps.download.outputs.mode == 'nix'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          nix run .#crucible-full -- update

      # Share the refreshed data with the jobs below; they run on the same
      # tree, so apply the patch after checkout.
      - id: changed
        run: |
          git add -A data
          if [ -n "$(git diff --cached --name-only HEAD -- data)" ]; then
            git diff --cached --binary > "$RUNNER_TEMP/data.patch"
            echo "data_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "data_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.changed.outputs.data_changed == 'true'
        with:
          name: data
          path: ${{ runner.temp }}/data.patch

  checks:
    needs: update
    if: needs.update.outputs.data_changed == 'true'
    strategy:
      # A platform-specific failure should not cancel the other platforms;
      # see check.yaml.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nix
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # setup-nix's Hestia cache is the persistent one; this warms the
          # per-run evaluation cache between runs.
          path: ${{ runner.os == 'macOS' && '/Users/runner/.cache/nix' || '/home/runner/.cache/nix' }}
          key: nix-${{ matrix.os }}-${{ hashFiles('flake.lock') }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: data
          path: ${{ runner.temp }}/data
      - name: Apply the data refresh
        run: git apply "$RUNNER_TEMP/data/data.patch"
      - name: Build cargo
        run: nix build -L .#cargo
      - name: Check version
        run: |
          version=$(jq -r .version data/rust/cargo.json)
          output=$(./result/bin/cargo -V)
          echo "Detected version: $output"
          if ! echo "$output" | grep -F "huacnlee/cargo $version"; then
            echo "Error: expected huacnlee/cargo $version"
            exit 1
          fi
      - name: Build toolchains and run checks
        run: nix flake check -L

  provenance:
    # Re-verify the provenance of the freshly written pins with the CLI built
    # from this checkout: even when `update` used a released binary, only this
    # tree's `--check` knows about all the current trust anchors. It runs on
    # the refreshed data rather than main, so it applies the same patch the
    # checks job did. Publication is gated on this job below.
    #
    # This workflow only runs on a schedule or a manual dispatch on the base
    # repository, so `github.token` is always available here; pull-request
    # forks never reach it. Attestation lookups are GitHub API calls: without
    # a token they share a 60 requests/hour bucket and a 403 is not retried,
    # so a rate-limited run fails with a hint to set GITHUB_TOKEN.
    needs: update
    if: needs.update.outputs.data_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nix
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: data
          path: ${{ runner.temp }}/data
      - name: Apply the data refresh
        run: git apply "$RUNNER_TEMP/data/data.patch"
      - name: Re-verify pin provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: nix run .#crucible-full -- update --check

  publish:
    needs: [update, checks, provenance]
    if: >-
      always()
      && needs.update.outputs.data_changed == 'true'
      && needs.checks.result == 'success'
      && needs.provenance.result == 'success'
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: data
          path: ${{ runner.temp }}/data
      - name: Commit the refresh and push it to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          patch="$RUNNER_TEMP/data/data.patch"

          # One line per pin: label<TAB>version. Comparing the before and
          # after manifests is the commit message, so it names only pins that
          # actually moved -- not the whole pin table and no workflow prose.
          manifest() {
            local dir="$1"
            {
              printf 'cargo\t%s\n' "$(jq -r .version "$dir/rust/cargo.json")"
              printf 'rust stable\t%s\n' "$(jq -r .version "$dir/rust/stable.json")"
              printf 'rust beta\t%s\n' "$(jq -r .version "$dir/rust/beta.json")"
              printf 'rust nightly\t%s\n' "$(jq -r '.version + " " + .date' "$dir/rust/nightly.json")"
              printf 'node lts\t%s\n' "$(jq -r '.releases[.lts].version' "$dir/node/node.json")"
              printf 'node current\t%s\n' "$(jq -r '.releases[.current].version' "$dir/node/node.json")"
              printf 'vite+\t%s\n' "$(jq -r .version "$dir/node/vite-plus.json")"
              jq -r '.pnpm|to_entries[]|"pnpm \(.key)\t\(.value.version)"' "$dir/node/package-managers.json"
              jq -r '.yarn|to_entries[]|"yarn \(.key)\t\(.value.version)"' "$dir/node/package-managers.json"
              jq -r '.bun|to_entries[]|"bun \(.key)\t\(.value.version)"' "$dir/node/package-managers.json"
              jq -r '.[]|"deno\t\(.version)"' "$dir/deno/deno.json"
              jq -r '.releases|to_entries[]|"python \(.key)\t\(.value.version + (if .value.freethreaded then "t" else "" end))"' "$dir/python/python.json"
              printf 'uv\t%s\n' "$(jq -r .version "$dir/python/uv.json")"
              jq -r '.releases|to_entries[]|"go \(.key)\t\(.value.version)"' "$dir/go/go.json"
              jq -r '.releases|to_entries[]|"zig \(.key)\t\(.value.version)"' "$dir/zig/zig.json"
              printf 'tsrs\t%s\n' "$(jq -r .version "$dir/tsrs/tsrs.json")"
              if [ -f "$dir/elm/elm.json" ]; then
                jq -r 'to_entries[]|"elm\t\(.key)"' "$dir/elm/elm.json"
              fi
            } | sort
          }

          for _ in 1 2 3; do
            # The patch was cut against the tip of main the update job saw,
            # which may have moved while the checks ran; rebuild on the tip as
            # it is now rather than push a non-fast-forward.
            git fetch --depth=1 origin main
            git reset --hard FETCH_HEAD
            rm -rf "$RUNNER_TEMP/data-before"
            cp -a data "$RUNNER_TEMP/data-before"
            git apply "$patch" || {
              # A main that already carries this refresh (a manual update, or
              # an earlier run) makes the forward patch fail; the reverse
              # patch then applies cleanly, and there is nothing left to do.
              if git apply -R --check "$patch"; then
                echo "data/ already matches main; nothing to publish"
                exit 0
              fi
              echo "error: the refreshed data no longer applies to main;" >&2
              echo "error: leaving it to the next run" >&2
              exit 1
            }
            git add -A data
            if git diff --cached --quiet; then
              echo "data/ already matches main; nothing to publish"
              exit 0
            fi

            manifest "$RUNNER_TEMP/data-before" > "$RUNNER_TEMP/pins.before"
            manifest data > "$RUNNER_TEMP/pins.after"
            awk -F '\t' '
              NR == FNR { old[$1] = $2; next }
              ($1 in old) && old[$1] != $2 { printf "%s\t%s\t%s\n", $1, old[$1], $2 }
            ' "$RUNNER_TEMP/pins.before" "$RUNNER_TEMP/pins.after" > "$RUNNER_TEMP/changed"

            {
              # The subject is only the families that moved, in a few words.
              families=$(awk -F '\t' '{print $1}' "$RUNNER_TEMP/changed" \
                | sed 's/ .*//' | sort -u | paste -sd, - | sed 's/,/, /g')
              printf 'update: %s\n' "${families:-pins}"
              printf '\n'
              if [ -s "$RUNNER_TEMP/changed" ]; then
                while IFS=$'\t' read -r label old new; do
                  printf -- '- %s: %s -> %s\n' "$label" "$old" "$new"
                done < "$RUNNER_TEMP/changed"
              else
                # A hash-only refresh has no version change: name the files.
                git diff --cached --name-only -- data | sed 's/^/- /'
              fi
            } > "$RUNNER_TEMP/message"

            git commit -F "$RUNNER_TEMP/message"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push raced with another commit on main; retrying"
          done
          echo "error: main kept moving; leaving it to the next run" >&2
          exit 1
