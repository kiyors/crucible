name: update

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-nix

      - name: Update huacnlee/cargo and the pinned Rust channels
        id: update
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          nix run .#nix-cargo -- update
          {
            echo "cargo=$(jq -r .version sources.json)"
            echo "stable=$(jq -r .version data/stable.json)"
            echo "nightly=$(jq -r '.version + " " + .date' data/nightly.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Update flake.lock
        run: nix flake update

      - name: Build cargo and the default toolchain
        run: nix build -L .#cargo .#default

      - name: Open a pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: update/sources
          delete-branch: true
          commit-message: "update: cargo ${{ steps.update.outputs.cargo }}, rust ${{ steps.update.outputs.stable }}"
          title: "update: cargo ${{ steps.update.outputs.cargo }}, rust ${{ steps.update.outputs.stable }}"
          body: |
            - [huacnlee/cargo v${{ steps.update.outputs.cargo }}](https://github.com/huacnlee/cargo/releases/tag/v${{ steps.update.outputs.cargo }})
            - stable: ${{ steps.update.outputs.stable }}
            - nightly: ${{ steps.update.outputs.nightly }}

            The check workflow builds a crate with every toolchain on Linux and macOS before this can merge.
          add-paths: |
            sources.json
            data/*.json
            flake.lock
