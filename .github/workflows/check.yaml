name: check
on:
  pull_request:
    paths:
      - "*.md"
      - "**/*.md"
      - ".github/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "data/**"
      - "dev/**"
      - "docs/**"
      - "lib/**"
      - "modules/**"
      - "overlay.nix"
      - "scripts/**"
      - "templates/**"
      - "tests/**"
      - "default.nix"
      - "flake.lock"
      - "flake.nix"
  push:
    branches:
      - main
    paths:
      - "*.md"
      - "**/*.md"
      - ".github/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "data/**"
      - "dev/**"
      - "docs/**"
      - "lib/**"
      - "modules/**"
      - "overlay.nix"
      - "scripts/**"
      - "templates/**"
      - "tests/**"
      - "default.nix"
      - "flake.lock"
      - "flake.nix"

concurrency:
  # Cancel overlapping runs on PRs; on main, the latest run finishes.
  group: check-${{ github.event_name == 'pull_request' && github.ref || format('push-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  determine:
    runs-on: ubuntu-latest
    outputs:
      heavy: ${{ steps.determine.outputs.heavy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: determine
        run: |
          heavy=false
          if [ "${{ github.event_name }}" = "push" ]; then
            heavy=true
          else
            while IFS= read -r file; do
              case "$file" in
                *.md|docs/*) ;;
                *) heavy=true ;;
              esac
            done < <(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD)
          fi
          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"

  fmt-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nix
      - name: Check Nix formatting
        run: cd dev && nix fmt -- --fail-on-change
      - name: Run git-hooks checks
        run: cd dev && nix flake check -L

  build-and-test:
    needs: determine
    if: needs.determine.outputs.heavy == 'true'
    strategy:
      # a platform-specific failure should not cancel the other platforms,
      # otherwise their results are unknown until the first one is fixed
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nix
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # setup-nix's Hestia cache is the persistent one; this warms the
          # per-run evaluation cache between runs.
          path: ${{ runner.os == 'macOS' && '/Users/runner/.cache/nix' || '/home/runner/.cache/nix' }}
          key: nix-${{ matrix.os }}-${{ hashFiles('flake.lock') }}
      - name: Build cargo
        run: nix build -L .#cargo
      - name: Check version
        run: |
          version=$(jq -r .version data/rust/cargo.json)
          output=$(./result/bin/cargo -V)
          echo "Detected version: $output"
          if ! echo "$output" | grep -F "huacnlee/cargo $version"; then
            echo "Error: expected huacnlee/cargo $version"
            exit 1
          fi
      - name: Build toolchains and run checks
        # Builds a crate with the stable, nightly, wasm32 and rust-toolchain.toml
        # toolchains, and with the stock-cargo rustPlatform.
        run: nix flake check -L
